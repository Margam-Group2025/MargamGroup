version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ui          # Navigate to your UI project folder
        - npm ci         # Install dependencies
    build:
      commands:
        - npm run build  # Build the project
  artifacts:
    baseDirectory: ui/dist   # Path to your build output folder
    files:
      - '**/*'
  cache:
    paths:
      - ui/node_modules/**/*  # Cache dependencies
